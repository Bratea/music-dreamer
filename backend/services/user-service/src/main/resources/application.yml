server:
  port: 8081

spring:
  application:
    name: user-service
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/music_dreamer?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    username: ${MYSQL_USER:music}
    password: ${MYSQL_PASSWORD:music123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis123456}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:redis}:${REDIS_PORT:6379}"
          password: ${REDIS_PASSWORD:redis123456}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:musicdreamer2025secretkeymusicdreamer2025secret}
  expiration: 900000
  refresh-expiration: 604800000


# Sentinel 控制台地址（未部署 Sentinel dashboard 时注释掉，避免无效连接）
# spring.cloud.sentinel.transport.dashboard: sentinel:8080

logging:
  level:
    com.musicdreamer: DEBUG

