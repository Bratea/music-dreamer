server:
  port: 8083

spring:
  application:
    name: playlist-service
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/music_dreamer?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    username: ${MYSQL_USER:music}
    password: ${MYSQL_PASSWORD:music123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

spring.cloud.sentinel.transport.dashboard: localhost:8080

logging:
  level:
    com.musicdreamer: DEBUG

