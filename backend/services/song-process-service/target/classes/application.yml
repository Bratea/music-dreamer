server:
  port: 8085

spring:
  application:
    name: song-process-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:musicdreamer}
    password: ${RABBITMQ_PASS:music123456}
    virtual-host: /
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        acknowledge-mode: auto

logging:
  level:
    com.musicdreamer: DEBUG
